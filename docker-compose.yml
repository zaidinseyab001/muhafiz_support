  yolo:
    build:
      context: ./yolo_inference
      dockerfile: Dockerfile
    image: muhafiz/yolo_inference:latest
    container_name: muhafiz_yolo
    restart: unless-stopped
    ports:
      - "${WS_PORT:-5000}:${WS_PORT:-5000}"
    env_file:
      - ./.env
    environment:
      # Infrastructure-level env vars stay in compose — they're tied to the
      # nvidia-container-runtime, not to the application config.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
    volumes:
      - yolo_cache:/root/.cache
      - ultralytics_cache:/root/.config/Ultralytics
    # depends_on:
    #   - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  live_feeds:
    build:
      context: ./live_data_feeds
      dockerfile: Dockerfile
    image: muhafiz/live_data_feeds:latest
    container_name: muhafiz_live_feeds
    restart: unless-stopped
    ports:
      - "${PORT:-8181}:${PORT:-8181}"
    env_file:
      - ./.env
    volumes:
      # Surveillance/audio media is baked INTO the image (Dockerfile `COPY . .`,
      # and .dockerignore does not exclude them). Do NOT bind-mount the host
      # folders here — a bind-mount replaces the baked-in media with the (empty)
      # host folder on the deploy box. To change the media, update the files and
      # rebuild: ./scripts/build_airgap.sh live_feeds
      - live_feeds_normalized:/app/.normalized
      - live_feeds_tmp:/app/.tmp

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    image: muhafiz/whisper:latest
    container_name: muhafiz_whisper
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8000}:${WHISPER_PORT:-8000}"
    env_file:
      - ./.env
    environment:
      # Infrastructure-level GPU plumbing for the nvidia-container-runtime —
      # kept in compose (not .env), mirroring the yolo service.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      # The same surveillance audio corpus that live_feeds streams, mounted
      # read-only so whisper can transcribe files straight off disk by path:
      #   POST /transcribe_url {"url":"/data/audio/<file>.mp3"}
      # (ffmpeg reads the path directly). Ad-hoc clips can still be sent as a
      # normal multipart upload to /transcribe without any mount.
      - ./live_data_feeds/voice analysis:/data/audio:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${WHISPER_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # large-v3 takes longer to load than small — give it room before failing.
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_models:
  yolo_cache:
  ultralytics_cache:
  live_feeds_normalized:
  live_feeds_tmp:
